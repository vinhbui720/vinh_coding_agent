[keybindings]
scroll_up = "ctrl+k"
scroll_down = "ctrl+j"
scroll_page_up = "alt+u"
scroll_page_down = "alt+d"
model_switch_next = "ctrl+tab"
model_switch_prev = "ctrl+shift+tab"
effort_increase = "alt+right"
effort_decrease = "alt+left"
centered_toggle = "alt+c"
scroll_prompt_up = "ctrl+["
scroll_prompt_down = "ctrl+]"
scroll_bookmark = "ctrl+g"
scroll_up_fallback = "cmd+k"
scroll_down_fallback = "cmd+j"
workspace_left = "alt+h"
workspace_down = "alt+j"
workspace_up = "alt+k"
workspace_right = "alt+l"
session_picker_enter = "new-terminal"

[dictation]
command = ""
mode = "send"
key = "off"
timeout_secs = 90

[display]
diff_mode = "inline"
queue_mode = false
auto_server_reload = true
mouse_capture = true
debug_socket = false
centered = false
show_thinking = false
diagram_mode = "none"
markdown_spacing = "compact"
pin_images = true
idle_animation = true
prompt_entry_animation = true
disabled_animations = []
diff_line_wrap = true
performance = ""
animation_fps = 60
redraw_fps = 60
prompt_preview = true

[display.native_scrollbars]
chat = true
side_panel = true

[features]
memory = true
swarm = true
message_timestamps = true
update_channel = "stable"

[websearch]
engine = "duckduckgo"
fallback_engines = ["bing"]
bing_api_key_env = "JCODE_BING_API_KEY"
bing_market = "en-US"

[auth]
trusted_external_sources = []
trusted_external_source_paths = [
    "claude_code_credentials|/home/vinh/.claude/.credentials.json",
    "gemini_cli_oauth_creds|/home/vinh/.gemini/oauth_creds.json",
    "openai_codex_auth_json|/home/vinh/.codex/auth.json",
]

[provider]
openai_reasoning_effort = "low"
openai_service_tier = "priority"
openai_native_compaction_mode = "auto"
openai_native_compaction_threshold_tokens = 200000
cross_provider_failover = "countdown"
same_provider_account_failover = true

[providers]

[agents]
swarm_spawn_mode = "visible"
memory_sidecar_enabled = true

[ambient]
enabled = false
allow_api_keys = false
min_interval_minutes = 5
max_interval_minutes = 120
pause_on_active_session = true
proactive_work = true
work_branch_prefix = "ambient/"
visible = true

[safety]
ntfy_server = "https://ntfy.sh"
desktop_notifications = true
email_enabled = false
email_smtp_port = 587
email_imap_port = 993
email_reply_enabled = false
telegram_enabled = false
telegram_reply_enabled = false
discord_enabled = false
discord_reply_enabled = false

[gateway]
enabled = false
port = 7643
bind_addr = "0.0.0.0"

[compaction]
mode = "reactive"
lookahead_turns = 15
ewma_alpha = 0.30000001192092896
proactive_floor = 0.4000000059604645
min_samples = 3
stall_window = 5
min_turns_between_compactions = 10
topic_shift_threshold = 0.44999998807907104
relevance_keep_threshold = 0.6499999761581421
goal_window_turns = 5

[autoreview]
enabled = false

[autojudge]
enabled = false
